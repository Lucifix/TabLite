<!doctype html>
<!--
  Illustration of TabLite for the README (not a real screen capture).
  Proportions and colors follow the app: 220x170 tiles, 10 gap, 18 padding, 24 radius,
  gradient rim, pill selection. Render with docs/render-screenshots.sh.
  Open as screenshot.html#light or screenshot.html#dark.
-->
<html>
<head>
<meta charset="utf-8">
<title>TabLite screenshot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body {
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body.dark {
    --text: rgba(255,255,255,.92); --selFill: rgba(255,255,255,.14); --selBorder: rgba(255,255,255,.35);
    --rimTop: rgba(255,255,255,.45); --rimBottom: rgba(255,255,255,.06);
    --glass: rgba(30,30,44,.58); --edge: rgba(0,0,0,.35); --menu: rgba(16,14,34,.38); --menuText: #fff;
  }
  body.light {
    --text: rgba(0,0,0,.85); --selFill: rgba(255,255,255,.55); --selBorder: rgba(0,0,0,.12);
    --rimTop: rgba(255,255,255,.95); --rimBottom: rgba(255,255,255,.35);
    --glass: rgba(248,248,252,.58); --edge: rgba(0,0,0,.10); --menu: rgba(255,255,255,.42); --menuText: #111;
  }

  /* Wallpaper: soft aurora, no photos */
  .wall { position: absolute; inset: 0; }
  body.dark .wall { background:
      radial-gradient(55% 75% at 12% 18%, #7b3cff 0%, transparent 62%),
      radial-gradient(45% 65% at 88% 22%, #ff4f9a 0%, transparent 58%),
      radial-gradient(65% 65% at 62% 105%, #00b8ff 0%, transparent 62%),
      radial-gradient(40% 50% at 35% 70%, #2d1b8f 0%, transparent 70%),
      linear-gradient(160deg, #0a0a26, #170c38 50%, #061a30); }
  body.light .wall { background:
      radial-gradient(55% 75% at 10% 15%, #ffc9a8 0%, transparent 62%),
      radial-gradient(50% 70% at 90% 20%, #c7b4ff 0%, transparent 60%),
      radial-gradient(70% 70% at 55% 110%, #92dcff 0%, transparent 62%),
      radial-gradient(40% 50% at 30% 75%, #ffd6f0 0%, transparent 70%),
      linear-gradient(160deg, #fff6f2, #eef1ff); }

  /* Menu bar */
  .menubar {
    position: absolute; top: 0; left: 0; right: 0; height: 30px; z-index: 5;
    display: flex; align-items: center; gap: 22px; padding: 0 18px;
    font-size: 13.5px; color: var(--menuText); background: var(--menu);
    backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
  }
  .menubar b { font-weight: 700; }
  .menubar .right { margin-left: auto; display: flex; gap: 18px; align-items: center; }
  .menubar svg { display: block; }

  /* App windows */
  .win { position: absolute; width: 800px; height: 500px; border-radius: 12px; overflow: hidden;
         box-shadow: 0 0 0 1px rgba(0,0,0,.18), 0 30px 80px rgba(0,0,0,.35); display: flex; flex-direction: column; }
  .tb { height: 38px; flex: none; display: flex; align-items: center; padding: 0 14px; gap: 8px; position: relative; }
  .tb i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .tb i:nth-child(1) { background: #ff5f57; } .tb i:nth-child(2) { background: #febc2e; } .tb i:nth-child(3) { background: #28c840; }
  .tb .ttl { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 600; pointer-events: none; }
  .wbody { flex: 1; display: flex; min-height: 0; }

  .w-code { background: #1d1e27; } .w-code .tb { background: #262733; } .w-code .ttl { color: #b9bccb; }
  .w-code .side { width: 170px; background: #20212b; border-right: 1px solid #2e2f3c; padding: 14px 10px; font-size: 12.5px; color: #9ea2b5; }
  .w-code .side div { padding: 5px 8px; border-radius: 6px; }
  .w-code .side .on { background: #343650; color: #fff; }
  .w-code pre { padding: 16px 18px; font: 13px/22px ui-monospace, "SF Mono", Menlo, monospace; color: #e3e5f0; }
  .ln { color: #4d5166; display: inline-block; width: 26px; }
  .kw { color: #ff7ab2; } .fn { color: #67b7ff; } .cm { color: #6c7a89; font-style: italic; } .ty { color: #5dd8c8; } .st { color: #ffa14f; }

  .w-term { background: #14151b; } .w-term .tb { background: #1f2028; } .w-term .ttl { color: #a8abb8; }
  .w-term pre { padding: 18px; font: 14px/24px ui-monospace, "SF Mono", Menlo, monospace; color: #d7dae6; }
  .pr { color: #7ee787; } .dim { color: #7d8196; } .hash { color: #f2cc60; }
  .cur { display: inline-block; width: 9px; height: 17px; background: #d7dae6; vertical-align: -3px; }

  .w-web { background: #fff; } .w-web .tb { background: #f1f1f4; border-bottom: 1px solid #e2e2e8; height: 46px; }
  .url { position: absolute; left: 50%; transform: translateX(-50%); width: 360px; height: 28px; border-radius: 8px;
         background: #e4e4ea; color: #555; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .w-web .page { flex: 1; padding: 22px 26px; display: flex; flex-direction: column; gap: 20px; }
  .hero { height: 200px; border-radius: 14px; padding: 34px 36px; color: #fff;
          background: radial-gradient(80% 120% at 85% 10%, #ffb36b, transparent 60%), linear-gradient(120deg, #ff5f8f, #8b5cf6 55%, #3b82f6); }
  .hero h1 { font-size: 40px; letter-spacing: -.02em; font-weight: 800; }
  .hero p { margin-top: 8px; font-size: 16px; opacity: .9; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { border-radius: 12px; background: #f4f4f8; overflow: hidden; }
  .card .img { height: 92px; }
  .card .t { margin: 12px 14px 6px; height: 11px; width: 70%; border-radius: 6px; background: #c9c9d6; }
  .card .t2 { margin: 0 14px 14px; height: 9px; width: 50%; border-radius: 5px; background: #dedee8; }

  .w-notes { background: #fffdf7; } .w-notes .tb { background: #f6f0e2; } .w-notes .ttl { color: #6b6250; }
  .w-notes .side { width: 190px; background: #f6f0e2; padding: 14px 12px; font-size: 13px; color: #6b6250; }
  .w-notes .side div { padding: 6px 10px; border-radius: 7px; }
  .w-notes .side .on { background: #f2c94c; color: #3b3220; font-weight: 600; }
  .w-notes .doc { padding: 26px 34px; color: #2b2720; }
  .w-notes h2 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
  .w-notes .date { color: #a39a86; font-size: 13px; margin: 6px 0 18px; }
  .w-notes li { list-style: none; font-size: 16px; line-height: 34px; display: flex; gap: 12px; align-items: center; }
  .box { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c8bfa8; flex: none; }
  .box.done { background: #f2b230; border-color: #f2b230; }
  .done + span { color: #a39a86; text-decoration: line-through; }

  .w-photos { background: #1c1c1e; } .w-photos .tb { background: #252527; } .w-photos .ttl { color: #b5b5ba; }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 6px; padding: 10px; }
  .grid div { border-radius: 6px; }

  /* TabLite panel */
  .panel {
    position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); z-index: 4;
    display: grid; grid-template-columns: repeat(5, 220px); gap: 10px; padding: 18px; border-radius: 24px;
    background: var(--glass);
    backdrop-filter: blur(46px) saturate(190%); -webkit-backdrop-filter: blur(46px) saturate(190%);
    box-shadow: 0 0 0 1px var(--edge), 0 40px 110px rgba(10,5,40,.45);
  }
  .panel::before {
    content: ""; position: absolute; inset: 1px; border-radius: 23px; padding: 1px; pointer-events: none;
    background: linear-gradient(180deg, var(--rimTop), var(--rimBottom));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  .tile { width: 220px; height: 170px; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; }
  .tile.sel { background: var(--selFill); box-shadow: inset 0 0 0 1px var(--selBorder); }
  .thumb { width: 200px; height: 112px; display: flex; align-items: center; justify-content: center; }
  .mini { width: 179.2px; height: 112px; position: relative; border-radius: 3px;
          box-shadow: 0 4px 14px rgba(0,0,0,.28); }
  .mini > .win { left: 0; top: 0; transform: scale(.224); transform-origin: 0 0; box-shadow: none; }
  .cap { height: 38px; display: flex; align-items: center; gap: 7px; color: var(--text); font-size: 12px; white-space: nowrap; }
  .cap span { overflow: hidden; text-overflow: ellipsis; }
  .ico { width: 22px; height: 22px; border-radius: 6px; flex: none; display: grid; place-items: center;
         color: #fff; font: 700 10px/1 ui-monospace, Menlo, monospace; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.2); }
  .i-code { background: linear-gradient(160deg, #6b8cff, #7a4dff); }
  .i-web { background: linear-gradient(160deg, #46d0ff, #2a6af0); }
  .i-term { background: linear-gradient(160deg, #3a3a3e, #0d0d0f); color: #7ee787; }
  .i-notes { background: linear-gradient(160deg, #ffe07a, #ffb21f); }
  .i-photos { background: conic-gradient(from 0deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #b06bff, #ff6b6b); }
</style>
</head>
<body>
<div class="wall"></div>

<div class="menubar">
  <b>Notes</b><span>File</span><span>Edit</span><span>Format</span><span>View</span><span>Window</span><span>Help</span>
  <div class="right">
    <!-- TabLite menu bar glyph -->
    <svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="currentColor">
      <rect x="1.35" y="3.6" width="4.8" height="6.8" rx="1.2" stroke-width="1.2"/>
      <rect x="7" y="2" width="6" height="10" rx="1.5" fill="currentColor" stroke="none"/>
      <rect x="13.85" y="3.6" width="4.8" height="6.8" rx="1.2" stroke-width="1.2"/>
    </svg>
    <svg width="17" height="13" viewBox="0 0 17 13" fill="currentColor"><path d="M8.5 2.2c2.6 0 4.9 1 6.6 2.7l1.2-1.2A10.9 10.9 0 0 0 8.5.5 10.9 10.9 0 0 0 .7 3.7l1.2 1.2A9.2 9.2 0 0 1 8.5 2.2Zm0 3.4c1.6 0 3.1.6 4.2 1.7l1.2-1.2a7.6 7.6 0 0 0-10.8 0l1.2 1.2A5.9 5.9 0 0 1 8.5 5.6Zm0 3.4c.7 0 1.3.3 1.8.7L8.5 11.5 6.7 9.7c.5-.4 1.1-.7 1.8-.7Z"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="22" height="12" rx="3.5" opacity=".5"/><rect x="2.5" y="2.5" width="15" height="8" rx="1.8" fill="currentColor" stroke="none"/><path d="M24.5 4.5v4" stroke-width="1.5" stroke-linecap="round" opacity=".5"/></svg>
    <span>Sun 22 Nov&nbsp;&nbsp;9:41</span>
  </div>
</div>

<div id="desk"></div>
<div class="panel" id="panel"></div>

<script>
const W = {
  code: () => `
    <div class="win w-code">
      <div class="tb"><i></i><i></i><i></i><div class="ttl">main.swift — TabLite</div></div>
      <div class="wbody">
        <div class="side"><div class="on">main.swift</div><div>build.sh</div><div>README.md</div><div>LICENSE</div><div>icon/</div><div>docs/</div></div>
<pre><span class="ln">412</span><span class="kw">func</span> <span class="fn">show</span>() {
<span class="ln">413</span>    <span class="kw">guard</span> active, !shown <span class="kw">else</span> { <span class="kw">return</span> }
<span class="ln">414</span>    shown = <span class="kw">true</span>
<span class="ln">415</span>    view.<span class="fn">rebuild</span>(wins: wins, layout: layout)
<span class="ln">416</span>    panel.<span class="fn">orderFrontRegardless</span>()
<span class="ln">417</span>
<span class="ln">418</span>    <span class="cm">// Fresh previews in the background,</span>
<span class="ln">419</span>    <span class="cm">// selected window first.</span>
<span class="ln">420</span>    <span class="fn">capturePreviews</span>(ids, maxW: tw, maxH: th) {
<span class="ln">421</span>        id, img <span class="kw">in</span>
<span class="ln">422</span>        <span class="kw">self</span>.cache[id] = img
<span class="ln">423</span>        <span class="kw">self</span>.view.<span class="fn">setThumb</span>(i, img)
<span class="ln">424</span>    }
<span class="ln">425</span>}
<span class="ln">426</span>
<span class="ln">427</span><span class="kw">let</span> panelRadius: <span class="ty">CGFloat</span> = <span class="st">24</span></pre>
      </div>
    </div>`,
  web: () => `
    <div class="win w-web">
      <div class="tb"><i></i><i></i><i></i><div class="url">designweekly.example/glass</div></div>
      <div class="page">
        <div class="hero"><h1>Glass, done right.</h1><p>Seven interfaces that feel light and fast.</p></div>
        <div class="cards">
          <div class="card"><div class="img" style="background:linear-gradient(135deg,#a1c4fd,#c2e9fb)"></div><div class="t"></div><div class="t2"></div></div>
          <div class="card"><div class="img" style="background:linear-gradient(135deg,#fbc2eb,#a6c1ee)"></div><div class="t"></div><div class="t2"></div></div>
          <div class="card"><div class="img" style="background:linear-gradient(135deg,#fddb92,#d1fdff)"></div><div class="t"></div><div class="t2"></div></div>
        </div>
      </div>
    </div>`,
  term: () => `
    <div class="win w-term">
      <div class="tb"><i></i><i></i><i></i><div class="ttl">zsh — ~/TabLite</div></div>
<pre><span class="pr">~/TabLite ❯</span> ./build.sh
Signed with 'TabLite Dev'
Built TabLite.app
<span class="pr">~/TabLite ❯</span> open TabLite.app
<span class="pr">~/TabLite ❯</span> git log --oneline
<span class="hash">a1c3f9e</span> ScreenCaptureKit previews on macOS 14+
<span class="hash">7d02b41</span> Liquid Glass on macOS 26
<span class="hash">5b8e1d7</span> App icon and menu bar glyph
<span class="hash">3e9a0c2</span> Initial commit
<span class="pr">~/TabLite ❯</span> <span class="cur"></span></pre>
    </div>`,
  notes: () => `
    <div class="win w-notes">
      <div class="tb"><i></i><i></i><i></i><div class="ttl">Release checklist</div></div>
      <div class="wbody">
        <div class="side"><div>All Notes</div><div class="on">Projects</div><div>Ideas</div><div>Travel</div><div>Recipes</div></div>
        <div class="doc">
          <h2>Release checklist</h2><div class="date">22 November 2026</div>
          <ul>
            <li><i class="box done"></i><span>App icon &amp; menu bar glyph</span></li>
            <li><i class="box done"></i><span>GPL-3.0 license</span></li>
            <li><i class="box done"></i><span>ScreenCaptureKit previews</span></li>
            <li><i class="box"></i><span>Screenshots for the README</span></li>
            <li><i class="box"></i><span>Publish on GitHub</span></li>
          </ul>
        </div>
      </div>
    </div>`,
  photos: () => {
    const g = ["#ff9a8b,#ff6a88","#a18cd1,#fbc2eb","#84fab0,#8fd3f4","#fccb90,#d57eeb","#e0c3fc,#8ec5fc",
               "#f6d365,#fda085","#43e97b,#38f9d7","#fa709a,#fee140","#30cfd0,#330867","#5ee7df,#b490ca",
               "#c79081,#dfa579","#89f7fe,#66a6ff"];
    return `
    <div class="win w-photos">
      <div class="tb"><i></i><i></i><i></i><div class="ttl">Iceland 2026</div></div>
      <div class="grid">${g.map(c => `<div style="background:linear-gradient(150deg,${c})"></div>`).join("")}</div>
    </div>`;
  },
};

const theme = location.hash === "#light" ? "light" : "dark";
document.body.className = theme;

// Desktop windows behind the switcher.
const place = (html, left, top, scale = 1) => {
  const d = document.createElement("div");
  d.innerHTML = html.trim();
  const w = d.firstChild;
  w.style.left = left + "px"; w.style.top = top + "px";
  if (scale !== 1) { w.style.transform = `scale(${scale})`; w.style.transformOrigin = "0 0"; }
  document.getElementById("desk").appendChild(w);
};
place(W.photos(), 1010, 64, .52);
place(W.web(), 64, 66, .74);
place(W.code(), 560, 606, .9);

// Switcher tiles; the second one is selected, like a real Option+Tab press.
const tiles = [
  ["web",    "i-web",    "Glass, done right. — designweekly", svg("web")],
  ["code",   "i-code",   "main.swift — TabLite", "&lt;/&gt;"],
  ["term",   "i-term",   "zsh — ~/TabLite", "&gt;_"],
  ["notes",  "i-notes",  "Release checklist", svg("notes")],
  ["photos", "i-photos", "Iceland 2026", ""],
];
const panel = document.getElementById("panel");
tiles.forEach(([kind, ico, title, glyph], i) => {
  const t = document.createElement("div");
  t.className = "tile" + (i === 1 ? " sel" : "");
  t.innerHTML = `<div class="thumb"><div class="mini">${W[kind]()}</div></div>
                 <div class="cap"><div class="ico ${ico}">${glyph}</div><span>${title}</span></div>`;
  panel.appendChild(t);
});

function svg(kind) {
  if (kind === "web") return `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="1.3"><circle cx="7" cy="7" r="5.6"/><path d="M1.4 7h11.2M7 1.4c1.8 1.6 2.6 3.5 2.6 5.6S8.8 11 7 12.6M7 1.4C5.2 3 4.4 4.9 4.4 7S5.2 11 7 12.6"/></svg>`;
  return `<svg width="12" height="12" viewBox="0 0 12 12" stroke="#7a5200" stroke-width="1.4" stroke-linecap="round"><path d="M2 3h8M2 6h8M2 9h5"/></svg>`;
}
</script>
</body>
</html>
